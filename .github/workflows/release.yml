name: Release

# Called by CI (ci.yml) only after backend, frontend and docker pass on a push to main, a v* tag
# or the weekly scheduled rebuild, so an image is never published from a red commit.
# Watchtower deploys :latest to production.
on:
  workflow_call:
    inputs:
      fresh-base:
        description: Pull the base images and build without layer cache (weekly rebuild).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/mcheli/tasks
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: ${{ inputs.fresh-base }}
          no-cache: ${{ inputs.fresh-base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
